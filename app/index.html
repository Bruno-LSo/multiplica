<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplica · Protótipo</title>
<meta name="description" content="Protótipo navegável da Multiplica (multipliqueai.com.br): rede de apoiadores, convite com link próprio, mapa, gastos, avisos e equipe por perfil.">
<meta name="theme-color" content="#f6f7f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1413" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=11">
</head>
<body>
<a class="pular" href="#principal">Pular para o conteúdo</a>
<header class="topo">
  <button class="bt-menu" id="abrir-menu" aria-label="Abrir menu"><span class="ic-menu" aria-hidden="true"></span><span class="txt">Menu</span></button>
  <a class="marca" href="#/painel"><svg class="marca-simbolo" viewBox="0 0 64 64" aria-hidden="true"><path d="M15 53 L40 28" stroke="#14b8a6" stroke-width="10" stroke-linecap="round" fill="none"/><circle cx="50" cy="16" r="7.5" fill="#14b8a6"/><path d="M49 53 L24 28" stroke="#ff7a59" stroke-width="10" stroke-linecap="round" fill="none"/><circle cx="14" cy="16" r="7.5" fill="#ff7a59"/></svg><span><b>Multiplica</b><small id="cargo-topo"></small></span></a>
  <label class="topo-campo" id="campo-camp" hidden><span>Números da campanha</span><select id="campanha" aria-label="Campanha"></select></label>
  <label class="topo-campo" id="campo-uf"><span>Estado</span><select id="uf-topo" aria-label="Estado em uso"></select></label>
  <label class="topo-campo" id="campo-escopo"><span>Ver números de</span><select id="escopo" aria-label="Região"></select></label>
  <span class="topo-vao"></span>
  <a class="sino" id="sino" href="#/alertas" aria-label="Avisos" hidden><span aria-hidden="true">Avisos</span><b hidden></b></a>
  <div class="usuario"><span><b id="usuario-nome"></b><small id="usuario-perfil"></small></span><button class="bt sec peq" id="sair" title="Volta para a escolha de perfis">Trocar<span class="txt"> perfil</span></button></div>
  <button class="bt-tema" id="tema" aria-label="Tema"><span aria-hidden="true"></span></button>
</header>
<nav class="menu" id="menu" aria-label="Seções"></nav>
<main id="principal" tabindex="-1"><p class="carregando">Carregando os municípios do IBGE…</p></main>
<p class="demo-faixa">Demonstração com pessoas, telefones, contas e valores fictícios. Municípios, mapas e população: IBGE (Censo 2022). <a href="../">Ler a proposta</a></p>
<div id="gaveta" hidden></div>
<div id="avisos" class="avisos" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="js/nucleo.js?v=11"></script>
<script src="js/mapa.js?v=11"></script>
<script src="js/telas.js?v=11"></script>
<script src="js/telas2.js?v=11"></script>
<script src="js/telas3.js?v=11"></script>
<script src="js/telas4.js?v=11"></script>
<script src="js/cadastro.js?v=11"></script>
<script src="js/ajuste.js?v=11"></script>
<script>
(async () => {
  try {
    await CIC.iniciar();
    CIC.ligarTopo();
    CIC.vigiarAjuste();
    addEventListener('hashchange', CIC.render);
    let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { const aberto = document.querySelector('#gaveta:not([hidden])') || document.querySelector('#modal:not([hidden])') || (document.querySelector('#sel-pop') && !document.querySelector('#sel-pop').hidden); if (aberto) return; if (['cadastro', 'contatos', 'acordos', 'config', 'auditoria', 'equipe', 'acessos', 'entrar'].includes(CIC.rota().nome)) CIC.ajustar(); else CIC.render(); }, 300); });
    CIC.render();
    setInterval(CIC.simular, 6500);
  } catch (e) {
    document.getElementById('principal').innerHTML = '<section class="bloqueio"><h1>Não carregou os dados.</h1><p>Abra pelo endereço do GitHub Pages ou por um servidor local. Aberto direto do disco, o navegador bloqueia a leitura dos arquivos de dados.</p></section>';
    console.error(e);
  }
})();
</script>
</body>
</html>
